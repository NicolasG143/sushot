[workspace]
resolver = "3"
members = ["core", "app", "platform-windows", "platform-linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license-file = "LICENSE"

[workspace.dependencies]
sushot-core = { path = "core" }
sushot-platform-windows = { path = "platform-windows" }
sushot-platform-linux = { path = "platform-linux" }
log = "0.4.35"
png = "0.18.1"
windows = "0.62.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
